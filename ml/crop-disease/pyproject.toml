[project]
name = "crop-disease"
version = "0.1.0"
description = "Crop pest and disease image classifier: data, training and experiments"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "mlflow>=3.0",
    "numpy>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "timm>=1.0",
    "torch>=2.6",
    "torchvision>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
keras = [
    "tensorflow>=2.20",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
