[project]
name = "climate-smart-agriculture-portal"
version = "0.1.0"
description = "Map-first climate-smart agriculture data portal for Pakistan"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=10.0",
    "python-multipart>=0.0.22",
    "rio-cogeo>=7.0.3",
    "titiler-core>=2.4.0",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
ml = [
    "torch>=2.1",
]
dev = [
    "geopandas>=1.2.0",
    "httpx2>=2.13.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "notebook>=7.6.3",
    "plotly>=7.1.0",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
